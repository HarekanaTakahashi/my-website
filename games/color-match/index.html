<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラーマッチパズル</title>
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <link rel="stylesheet" href="color-match.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="side-panel left-panel">
            <h1>カラー<br>マッチ</h1>
            <div class="scores-container">
                <div class="score-box">
                    <div class="score-label">スコア</div>
                    <div class="score-value" id="current-score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">ベスト</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
            <button class="new-game-btn" id="new-game-btn" aria-label="新しいゲーム">新しいゲーム</button>
            <div class="chain-display" id="chain-display"></div>
        </div>
        
        <div class="game-container">
            <canvas id="game-canvas" width="300" height="600"></canvas>
        </div>
        
        <div class="side-panel right-panel">
            <h3>次のピース</h3>
            <div class="next-piece" id="next-piece"></div>
            <h3>操作方法</h3>
            <div class="instructions">
                <div class="key-item"><span class="key">A/D</span> 左右移動</div>
                <div class="key-item"><span class="key">←→</span> 回転</div>
                <div class="key-item"><span class="key">W</span> ハードドロップ</div>
                <div class="key-item"><span class="key">S</span> 早く落とす</div>
            </div>
            <p class="game-tip">同じ色を4つ以上繋げて消そう！</p>
        </div>
    </div>

    <div class="game-message" id="game-message">
        <div class="message-content">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <button id="try-again-btn">もう一度</button>
        </div>
    </div>

    <script type="module" src="color-match.js"></script>
</body>
</html>
