<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Picross</title>
    <link rel="stylesheet" href="picross.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="side-panel left-panel">
            <h1>🧩 Picross</h1>
            <div class="puzzle-info">
                <div class="puzzle-name">パズル: <span id="puzzle-name">-</span></div>
                <div class="puzzle-difficulty">難易度: <span id="puzzle-difficulty">-</span></div>
            </div>
            <div class="info-section">
                <div class="lives-container">
                    <span class="lives-label">ライフ</span>
                    <span id="lives" class="lives">❤️❤️❤️</span>
                </div>
                <div class="timer-container">
                    <span class="timer-label">⏱️</span>
                    <span id="timer" class="timer">00:00</span>
                </div>
            </div>
            <div class="puzzle-selector">
                <label>パズル選択</label>
                <select id="puzzle-select"></select>
            </div>
            <div class="controls">
                <button class="control-btn btn-new" id="new-game">New Puzzle</button>
                <button class="control-btn btn-clear" id="clear-board">Clear</button>
            </div>
            <div class="best-times">
                <h4>ベストタイム</h4>
                <div id="best-times-list"></div>
            </div>
        </div>
        
        <div class="game-container">
            <div id="status" class="status"></div>
            <div id="board-container" class="board-container"></div>
        </div>
        
        <div class="side-panel right-panel">
            <h3>操作方法</h3>
            <div class="instructions">
                <div class="instruction-item">
                    <span class="key">左クリック</span> セルを塗る
                </div>
                <div class="instruction-item">
                    <span class="key">右クリック</span> ×印をつける
                </div>
                <div class="instruction-item">
                    <span class="key">もう一度</span> 状態をリセット
                </div>
            </div>
            <h3>ルール</h3>
            <div class="rules">
                <p>数字はその行・列で連続して塗るマスの数を示します。</p>
                <p>複数の数字がある場合、それらの間には1つ以上の空きマスがあります。</p>
                <p>すべての数字に従ってマスを塗ると、絵が完成します！</p>
            </div>
            <p class="game-tip">間違えるとライフが減ります。慎重に！</p>
        </div>
    </div>

    <div class="game-message" id="game-message">
        <div class="message-content">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <button class="message-btn" id="try-again-btn">もう一度</button>
        </div>
    </div>

    <script type="module" src="picross.js"></script>
</body>
</html>
