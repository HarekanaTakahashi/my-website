<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku 9x9</title>
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <link rel="stylesheet" href="sudoku.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="side-panel left-panel">
            <h1>🧩 Sudoku</h1>
            <div class="info-section">
                <div class="lives-container">
                    <span class="lives-label">ライフ</span>
                    <span id="lives" class="lives">❤️❤️❤️</span>
                </div>
                <div class="timer-container">
                    <span class="timer-label">⏱️</span>
                    <span id="timer" class="timer">00:00</span>
                </div>
            </div>
            <div class="difficulty-selector">
                <label>難易度</label>
                <select id="difficulty">
                    <option value="easy">イージー</option>
                    <option value="medium" selected>ミディアム</option>
                    <option value="hard">ハード</option>
                </select>
            </div>
            <div class="best-times">
                <div class="best-time">Easy: <span id="best-easy">--:--</span></div>
                <div class="best-time">Medium: <span id="best-medium">--:--</span></div>
                <div class="best-time">Hard: <span id="best-hard">--:--</span></div>
            </div>
            <div class="controls">
                <button class="control-btn btn-new" id="new-game">New Game</button>
                <button class="control-btn btn-clear" id="clear">Clear</button>
            </div>
        </div>
        
        <div class="game-container">
            <div id="status" class="status"></div>
            <div id="board" class="board"></div>
        </div>
        
        <div class="side-panel right-panel">
            <h3>入力モード</h3>
            <div class="mode-toggle">
                <button class="mode-btn active" id="input-mode">数字</button>
                <button class="mode-btn" id="memo-mode">メモ</button>
            </div>
            <h3>数字パッド</h3>
            <div class="number-pad">
                <button class="number-btn" data-number="1">1</button>
                <button class="number-btn" data-number="2">2</button>
                <button class="number-btn" data-number="3">3</button>
                <button class="number-btn" data-number="4">4</button>
                <button class="number-btn" data-number="5">5</button>
                <button class="number-btn" data-number="6">6</button>
                <button class="number-btn" data-number="7">7</button>
                <button class="number-btn" data-number="8">8</button>
                <button class="number-btn" data-number="9">9</button>
            </div>
            <p class="game-tip">各行・列・3x3ブロックに1-9を1つずつ入れよう</p>
        </div>
    </div>

    <script type="module" src="sudoku.js"></script>
</body>
</html>
