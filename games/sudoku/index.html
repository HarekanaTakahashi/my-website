<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku 9x9</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background-color: #333;
            padding: 2px;
            border-radius: 8px;
            margin-bottom: 20px;
            aspect-ratio: 1;
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 40px;
        }

        .cell:hover:not(.given) {
            background-color: #f0f0f0;
        }

        .cell.selected {
            background-color: #bbdefb;
        }

        .cell.given {
            color: #333;
            background-color: #e8eaf6;
            cursor: default;
        }

        .cell.user {
            color: #667eea;
        }

        .cell.error {
            background-color: #ffcdd2;
            color: #c62828;
        }

        /* 3x3 block borders */
        .cell:nth-child(3n):not(:nth-child(9n)) {
            border-right: 2px solid #333;
        }

        .cell:nth-child(n+1):nth-child(-n+27) {
            border-bottom: 2px solid #333;
        }

        .cell:nth-child(n+28):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }

        /* Memo numbers */
        .memo-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0;
            width: 100%;
            height: 100%;
            padding: 2px;
        }

        .memo-num {
            font-size: 8px;
            color: #999;
            font-weight: normal;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .number-btn {
            padding: 12px 8px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .number-btn:hover {
            background: #667eea;
            color: white;
        }

        .number-btn:active {
            transform: scale(0.95);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .control-btn {
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-new {
            background-color: #4caf50;
            color: white;
        }

        .btn-new:hover {
            background-color: #45a049;
        }

        .btn-clear {
            background-color: #f44336;
            color: white;
        }

        .btn-clear:hover {
            background-color: #da190b;
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        .status {
            text-align: center;
            margin-bottom: 12px;
            min-height: 24px;
            font-weight: 500;
        }

        .status.error {
            color: #c62828;
        }

        .status.success {
            color: #2e7d32;
        }

        .status.info {
            color: #1976d2;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 16px;
            }

            h1 {
                font-size: 24px;
            }

            .cell {
                font-size: 16px;
                min-height: 35px;
            }

            .number-btn {
                padding: 10px 6px;
                font-size: 16px;
            }

            .memo-num {
                font-size: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧩 Sudoku 9x9</h1>
        <p class="subtitle">各行・列・3x3ブロックに1-9を1つずつ入れよう</p>
        
        <div id="status" class="status"></div>
        
        <div class="mode-toggle">
            <button class="mode-btn active" id="input-mode">数字入力</button>
            <button class="mode-btn" id="memo-mode">メモ</button>
        </div>
        
        <div id="board" class="board"></div>
        
        <div class="number-pad">
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
        </div>
        
        <div class="controls">
            <button class="control-btn btn-new" id="new-game">New Game</button>
            <button class="control-btn btn-clear" id="clear">Clear</button>
        </div>
    </div>

    <script>
        // Puzzle presets (0 = empty cell) - 9x9 Sudoku puzzles
        const puzzles = [
            // Puzzle 1 - Easy
            [
                [5,3,0,0,7,0,0,0,0],
                [6,0,0,1,9,5,0,0,0],
                [0,9,8,0,0,0,0,6,0],
                [8,0,0,0,6,0,0,0,3],
                [4,0,0,8,0,3,0,0,1],
                [7,0,0,0,2,0,0,0,6],
                [0,6,0,0,0,0,2,8,0],
                [0,0,0,4,1,9,0,0,5],
                [0,0,0,0,8,0,0,7,9]
            ],
            // Puzzle 2 - Easy
            [
                [0,0,0,2,6,0,7,0,1],
                [6,8,0,0,7,0,0,9,0],
                [1,9,0,0,0,4,5,0,0],
                [8,2,0,1,0,0,0,4,0],
                [0,0,4,6,0,2,9,0,0],
                [0,5,0,0,0,3,0,2,8],
                [0,0,9,3,0,0,0,7,4],
                [0,4,0,0,5,0,0,3,6],
                [7,0,3,0,1,8,0,0,0]
            ],
            // Puzzle 3 - Medium
            [
                [0,2,0,6,0,8,0,0,0],
                [5,8,0,0,0,9,7,0,0],
                [0,0,0,0,4,0,0,0,0],
                [3,7,0,0,0,0,5,0,0],
                [6,0,0,0,0,0,0,0,4],
                [0,0,8,0,0,0,0,1,3],
                [0,0,0,0,2,0,0,0,0],
                [0,0,9,8,0,0,0,3,6],
                [0,0,0,3,0,6,0,9,0]
            ]
        ];

        // Solutions for each puzzle
        const solutions = [
            // Solution 1
            [
                [5,3,4,6,7,8,9,1,2],
                [6,7,2,1,9,5,3,4,8],
                [1,9,8,3,4,2,5,6,7],
                [8,5,9,7,6,1,4,2,3],
                [4,2,6,8,5,3,7,9,1],
                [7,1,3,9,2,4,8,5,6],
                [9,6,1,5,3,7,2,8,4],
                [2,8,7,4,1,9,6,3,5],
                [3,4,5,2,8,6,1,7,9]
            ],
            // Solution 2
            [
                [4,3,5,2,6,9,7,8,1],
                [6,8,2,5,7,1,4,9,3],
                [1,9,7,8,3,4,5,6,2],
                [8,2,6,1,9,5,3,4,7],
                [3,7,4,6,8,2,9,1,5],
                [9,5,1,7,4,3,6,2,8],
                [5,1,9,3,2,6,8,7,4],
                [2,4,8,9,5,7,1,3,6],
                [7,6,3,4,1,8,2,5,9]
            ],
            // Solution 3
            [
                [1,2,3,6,7,8,9,4,5],
                [5,8,4,2,3,9,7,6,1],
                [9,6,7,1,4,5,3,2,8],
                [3,7,2,4,6,1,5,8,9],
                [6,9,1,5,8,3,2,7,4],
                [4,5,8,7,9,2,6,1,3],
                [8,3,6,9,2,4,1,5,7],
                [2,1,9,8,5,7,4,3,6],
                [7,4,5,3,1,6,8,9,2]
            ]
        ];

        // Game state
        let currentPuzzle = [];
        let currentSolution = [];
        let board = [];
        let memos = []; // 9x9 array, each cell contains a Set of memo numbers
        let selectedCell = null;
        let inputMode = 'number'; // 'number' or 'memo'

        // Initialize
        function init() {
            newGame();
            setupEventListeners();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Mode toggle buttons
            document.getElementById('input-mode').addEventListener('click', () => {
                setInputMode('number');
            });
            
            document.getElementById('memo-mode').addEventListener('click', () => {
                setInputMode('memo');
            });

            // Number pad buttons
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const number = parseInt(btn.dataset.number);
                    if (selectedCell !== null) {
                        if (inputMode === 'number') {
                            placeNumber(selectedCell, number);
                        } else {
                            toggleMemo(selectedCell, number);
                        }
                    }
                });
            });

            // Control buttons
            document.getElementById('new-game').addEventListener('click', newGame);
            document.getElementById('clear').addEventListener('click', clearBoard);

            // Keyboard input
            document.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '9') {
                    const number = parseInt(e.key);
                    if (selectedCell !== null) {
                        if (inputMode === 'number') {
                            placeNumber(selectedCell, number);
                        } else {
                            toggleMemo(selectedCell, number);
                        }
                    }
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    if (selectedCell !== null) {
                        placeNumber(selectedCell, 0);
                    }
                } else if (e.key === 'm' || e.key === 'M') {
                    // Toggle mode with 'm' key
                    setInputMode(inputMode === 'number' ? 'memo' : 'number');
                }
            });
        }

        // Set input mode
        function setInputMode(mode) {
            inputMode = mode;
            document.getElementById('input-mode').classList.toggle('active', mode === 'number');
            document.getElementById('memo-mode').classList.toggle('active', mode === 'memo');
        }

        // Start a new game
        function newGame() {
            const puzzleIndex = Math.floor(Math.random() * puzzles.length);
            currentPuzzle = puzzles[puzzleIndex];
            currentSolution = solutions[puzzleIndex];
            
            // Copy puzzle to board
            board = currentPuzzle.map(row => [...row]);
            
            // Initialize memos
            memos = [];
            for (let i = 0; i < 9; i++) {
                memos[i] = [];
                for (let j = 0; j < 9; j++) {
                    memos[i][j] = new Set();
                }
            }
            
            selectedCell = null;
            inputMode = 'number';
            setInputMode('number');
            renderBoard();
            setStatus('新しいゲームを開始しました！', 'info');
        }

        // Clear user inputs
        function clearBoard() {
            board = currentPuzzle.map(row => [...row]);
            
            // Clear memos
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    memos[i][j].clear();
                }
            }
            
            selectedCell = null;
            renderBoard();
            setStatus('ボードをクリアしました', 'info');
        }

        // Toggle memo number
        function toggleMemo(index, number) {
            const row = Math.floor(index / 9);
            const col = index % 9;
            
            // Can't modify given cells
            if (currentPuzzle[row][col] !== 0) {
                return;
            }
            
            // Can't add memo if cell has a number
            if (board[row][col] !== 0) {
                return;
            }
            
            // Toggle memo
            if (memos[row][col].has(number)) {
                memos[row][col].delete(number);
            } else {
                memos[row][col].add(number);
            }
            
            renderBoard();
        }

        // Clear memos when placing a number
        function clearRelatedMemos(row, col, number) {
            // Clear from same row
            for (let c = 0; c < 9; c++) {
                memos[row][c].delete(number);
            }
            
            // Clear from same column
            for (let r = 0; r < 9; r++) {
                memos[r][col].delete(number);
            }
            
            // Clear from same 3x3 block
            const blockRow = Math.floor(row / 3) * 3;
            const blockCol = Math.floor(col / 3) * 3;
            for (let r = blockRow; r < blockRow + 3; r++) {
                for (let c = blockCol; c < blockCol + 3; c++) {
                    memos[r][c].delete(number);
                }
            }
        }

        // Render the board
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const value = board[row][col];
                    const isGiven = currentPuzzle[row][col] !== 0;
                    
                    if (value !== 0) {
                        cell.textContent = value;
                        if (isGiven) {
                            cell.classList.add('given');
                        } else {
                            cell.classList.add('user');
                        }
                    } else if (memos[row][col].size > 0) {
                        // Display memos in 3x3 grid
                        const memoContainer = document.createElement('div');
                        memoContainer.className = 'memo-container';
                        
                        for (let i = 1; i <= 9; i++) {
                            const memoNum = document.createElement('div');
                            memoNum.className = 'memo-num';
                            if (memos[row][col].has(i)) {
                                memoNum.textContent = i;
                            }
                            memoContainer.appendChild(memoNum);
                        }
                        
                        cell.appendChild(memoContainer);
                    }
                    
                    const index = row * 9 + col;
                    if (selectedCell === index && !isGiven) {
                        cell.classList.add('selected');
                    }
                    
                    // Check for errors
                    if (!isGiven && value !== 0 && hasError(row, col, value)) {
                        cell.classList.add('error');
                    }
                    
                    // Add click listener
                    if (!isGiven) {
                        cell.addEventListener('click', () => {
                            selectedCell = index;
                            renderBoard();
                        });
                    }
                    
                    boardElement.appendChild(cell);
                }
            }
        }

        // Place a number in the selected cell
        function placeNumber(index, number) {
            const row = Math.floor(index / 9);
            const col = index % 9;
            
            // Can't modify given cells
            if (currentPuzzle[row][col] !== 0) {
                return;
            }
            
            // Clear memos in this cell
            if (number !== 0) {
                memos[row][col].clear();
                // Clear related memos in row, column, and block
                clearRelatedMemos(row, col, number);
            }
            
            board[row][col] = number;
            renderBoard();
            
            // Check for completion
            if (isBoardComplete()) {
                if (isBoardCorrect()) {
                    setStatus('🎉 おめでとうございます！完成です！', 'success');
                } else {
                    setStatus('❌ まだ間違いがあります', 'error');
                }
            } else if (number !== 0 && hasError(row, col, number)) {
                setStatus('⚠️ 重複があります！', 'error');
            } else {
                setStatus('', '');
            }
        }

        // Check if a placement has errors (duplicates in row, column, or block)
        function hasError(row, col, value) {
            if (value === 0) return false;
            
            // Check row
            for (let c = 0; c < 9; c++) {
                if (c !== col && board[row][c] === value) {
                    return true;
                }
            }
            
            // Check column
            for (let r = 0; r < 9; r++) {
                if (r !== row && board[r][col] === value) {
                    return true;
                }
            }
            
            // Check 3x3 block
            const blockRow = Math.floor(row / 3) * 3;
            const blockCol = Math.floor(col / 3) * 3;
            for (let r = blockRow; r < blockRow + 3; r++) {
                for (let c = blockCol; c < blockCol + 3; c++) {
                    if ((r !== row || c !== col) && board[r][c] === value) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        // Check if board is complete (all cells filled)
        function isBoardComplete() {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Check if board is correct (matches solution)
        function isBoardCorrect() {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] !== currentSolution[row][col]) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Set status message
        function setStatus(message, type) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = 'status ' + type;
        }

        // Start the game
        init();
    </script>
</body>
</html>
