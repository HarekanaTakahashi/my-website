<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スライドパズル</title>
    <link rel="stylesheet" href="slide-puzzle.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="side-panel left-panel">
            <h1>スライド<br>パズル</h1>
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-label">移動</div>
                    <div class="stat-value" id="move-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ベスト</div>
                    <div class="stat-value" id="best-moves">-</div>
                </div>
            </div>
            <div class="size-selector">
                <label for="size-select">サイズ</label>
                <select id="size-select" aria-label="ボードサイズを選択">
                    <option value="3">3x3</option>
                    <option value="4">4x4</option>
                    <option value="5">5x5</option>
                </select>
            </div>
            <button class="shuffle-btn" id="shuffle-btn" aria-label="シャッフル">シャッフル</button>
        </div>
        
        <div class="game-container">
            <div class="board" id="board" role="grid" aria-label="スライドパズルボード">
            </div>
        </div>
        
        <div class="side-panel right-panel">
            <h3>操作方法</h3>
            <div class="instructions">
                <div class="key-item"><span class="key">クリック</span> タイル移動</div>
                <div class="key-item"><span class="key">↑↓←→</span> 移動</div>
            </div>
            <p class="game-tip">空白マスに隣接するタイルを動かして、数字を順番に並べよう！</p>
        </div>
    </div>

    <div class="game-message" id="game-message">
        <div class="message-content">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <button id="new-game-btn">新しいゲーム</button>
        </div>
    </div>

    <script type="module" src="slide-puzzle.js"></script>
</body>
</html>
