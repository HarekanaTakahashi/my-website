<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反射神経テスト</title>
    <link rel="stylesheet" href="reaction-test.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title-container">
                <h1>反射神経テスト</h1>
            </div>
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-label">ベスト</div>
                    <div class="stat-value" id="best-time">-</div>
                </div>
            </div>
        </div>
        
        <div class="game-info" id="game-info">
            緑色が表示されたら、できるだけ速くクリックしてください。
        </div>
        
        <div class="test-area" id="test-area" role="button" tabindex="0" aria-label="反射神経テストエリア">
            <div class="status-message" id="status-message" aria-live="polite">
                クリックしてスタート
            </div>
        </div>
        
        <div class="results hidden" id="results">
            <h2>結果</h2>
            <div class="result-list" id="result-list"></div>
            <div class="average-time">
                <span class="label">平均反応時間:</span>
                <span class="value" id="average-time">-</span>
            </div>
            <button class="retry-btn" id="retry-btn" aria-label="もう一度">もう一度</button>
        </div>
    </div>

    <script type="module" src="reaction-test.js"></script>
</body>
</html>
