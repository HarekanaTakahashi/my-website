<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロックパズル</title>
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <link rel="stylesheet" href="block-puzzle.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="side-panel left-panel">
            <h1>ブロック<br>パズル</h1>
            <div class="scores-container">
                <div class="score-box">
                    <div class="score-label">スコア</div>
                    <div class="score-value" id="current-score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">ベスト</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
            <button class="new-game-btn" id="new-game-btn" aria-label="新しいゲーム">新しいゲーム</button>
        </div>
        
        <div class="game-container">
            <div class="board" id="board"></div>
        </div>
        
        <div class="side-panel right-panel">
            <h3>次のブロック</h3>
            <div class="pieces" id="pieces"></div>
            <p class="game-tip">ブロックをボードに配置して、縦横の列を完成させよう！</p>
        </div>
    </div>

    <div class="game-message" id="game-message">
        <div class="message-content">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <button id="try-again-btn" aria-label="もう一度プレイする">もう一度</button>
        </div>
    </div>

    <script type="module" src="block-puzzle.js"></script>
</body>
</html>
